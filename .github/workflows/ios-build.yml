name: Build iOS IPA (macOS)

on:
  workflow_dispatch: {}
  push:
    branches: [ main ]

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: |
          npm ci

      - name: Build web
        run: |
          npm run build

      - name: Sync Capacitor iOS
        run: |
          npx cap sync ios

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'

      - name: Install fastlane
        run: |
          gem install fastlane -NV

      - name: Decode App Store Connect API key
        if: ${{ secrets.APP_STORE_CONNECT_KEY_BASE64 != '' }}
        run: |
          mkdir -p fastlane
          echo "$FASTLANE_KEY_B64" | base64 --decode > fastlane/AuthKey.p8
        env:
          FASTLANE_KEY_B64: ${{ secrets.APP_STORE_CONNECT_KEY_BASE64 }}

      - name: Build iOS with fastlane
        env:
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_KEY_PATH: fastlane/AuthKey.p8
        run: |
          bundle exec fastlane ios build

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-ipa
          path: fastlane/output/*.ipa

# Notes: This workflow is a template. To sign and upload to App Store Connect automatically,
# provide App Store Connect API key secrets (APP_STORE_CONNECT_KEY_BASE64, APP_STORE_CONNECT_KEY_ID, APP_STORE_CONNECT_ISSUER_ID)
# and configure Fastlane match or automatic signing. For manual provisioning, open the Xcode workspace generated by Capacitor and configure signing there.
