name: Publish Packages to GitHub Packages

on:
  release:
    types: [created, published]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        package:
          - packages/rule-engine
          - packages/database

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          registry-url: 'https://npm.pkg.github.com'

      - name: Install dependencies
        run: npm ci

      - name: Build package
        run: |
          cd ${{ matrix.package }}
          npm ci
          npm run build --if-present

      - name: Publish to GitHub Packages
        run: |
          cd ${{ matrix.package }}
          npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Release Assets
        if: github.event_name == 'release'
        run: |
          cd ${{ matrix.package }}
          tar -czf $(node -p "require('./package.json').name.split('/')[1]")-${{ github.event.release.tag_name }}.tar.gz dist/ || true
          zip -r $(node -p "require('./package.json').name.split('/')[1]")-${{ github.event.release.tag_name }}.zip dist/ -x "*/node_modules/*" || true

      - name: Upload Release Assets
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v1
        with:
          files: |
            ${{ matrix.package }}/*.tar.gz
            ${{ matrix.package }}/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
